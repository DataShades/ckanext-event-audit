name: Tests
on: [push, pull_request]
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          # ckan-image: see https://github.com/ckan/ckan-docker-base
          - ckan-version: "2.12"
            ckan-image: "2.12-py3.14"
          - ckan-version: "2.11"
            ckan-image: "2.11"
          - ckan-version: "2.10"
            ckan-image: "2.10"

    runs-on: ubuntu-latest
    container:
      image: ckan/ckan-dev:${{ matrix.ckan-image }}
      options: --user root
    services:
      solr:
        image: ckan/ckan-solr:${{ matrix.ckan-version }}-solr9
      postgres:
        image: ckan/ckan-postgres-dev:${{ matrix.ckan-version }}
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
      redis:
          image: redis:7

    env:
      CKAN_SQLALCHEMY_URL: postgresql://ckan_default:pass@postgres/ckan_test
      CKAN_DATASTORE_WRITE_URL: postgresql://datastore_write:pass@postgres/datastore_test
      CKAN_DATASTORE_READ_URL: postgresql://datastore_read:pass@postgres/datastore_test
      CKAN_SOLR_URL: http://solr:8983/solr/ckan
      # CKAN 2.12 ships redis-py 8, which defaults to RESP3 and greets the server with
      # `HELLO 3`. Force RESP2 there, and leave the other versions' URL untouched.
      CKAN_REDIS_URL: redis://redis:6379/1${{ matrix.ckan-version == '2.12' && '?protocol=2' || '' }}

    steps:
    - uses: actions/checkout@v4
    - name: Install requirements
      # Install any extra requirements your extension has here (dev requirements, other extensions etc)
      run: |
        # ckanext-tables 2.x isn't published on PyPI (yet), so install it from its tag
        pip install https://github.com/DataShades/ckanext-tables/archive/refs/tags/v2.0.1.tar.gz
        pip install -e '.[dev]'
    - name: Setup extension
      # Extra initialization steps
      run: |
        # Replace default path to CKAN core config file with the one on the container
        sed -i -e 's/use = config:.*/use = config:\/srv\/app\/src\/ckan\/test-core.ini/' test.ini

        ckan -c test.ini db init
    - name: Run tests
      run: pytest --ckan-ini=test.ini --cov=ckanext.event_audit --disable-warnings ckanext/event_audit

  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: "3.10"
    - name: Install ruff
      run: pip install "ruff==0.16.*"
    - name: Lint
      run: ruff check ckanext
    - name: Check formatting
      run: ruff format --check ckanext

  typecheck:
    # Informational for now: pyright still reports issues that predate this job.
    # Drop `continue-on-error` once it's clean.
    runs-on: ubuntu-latest
    continue-on-error: true
    container:
      image: ckan/ckan-dev:2.11
      options: --user root
    steps:
    - uses: actions/checkout@v4
    - name: Install requirements
      run: |
        pip install https://github.com/DataShades/ckanext-tables/archive/refs/tags/v2.0.1.tar.gz
        pip install -e '.[dev]' pyright
    - name: Type check
      run: pyright --pythonpath="$(command -v python)"
